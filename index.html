<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f3f8;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --primary: #6d5dfc;
  --primary-2: #8b5cf6;
  --success: #0f9f6e;
  --warning: #c27a00;
  --danger: #d14343;
  --shadow: 0 16px 40px rgba(31, 41, 55, .08);
}
* { 
  box-sizing: border-box;
}
body {   
  margin: 0;
  font-family: Inter, sans-serif; 
  background: var(--bg); 
  color: var(--text);
}
button, input, select, textarea { 
  font: inherit; 
}
button { 
  cursor: pointer; 
}
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr; 
}
.sidebar {
  background: #11131b; 
  color: #fff; 
  padding: 22px 16px; 
  display: flex; 
  flex-direction: column; 
}
.brand { 
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 10px 26px;
}
.brand-mark {
  width: 36px;
  height: 36px; 
  border-radius: 12px; 
  display: grid; 
  place-items: center; 
  background: linear-gradient(135deg, var(--primary), #a855f7); 
  font-weight: 800; 
}
.brand-name { 
  font-family: 'Space Grotesk'; 
  font-weight: 700; 
  font-size: 20px; 
}
.nav-section { 
  margin: 14px 8px 8px; 
  color: #7f8494; 
  text-transform: uppercase; 
  letter-spacing: .08em; 
  font-size: 10px; 
  font-weight: 700;
}
.nav { 
  display: flex; 
  flex-direction: column; 
  gap: 4px; 
}
.nav button {
  border: 0; 
  background: transparent; 
  color: #b9bdc9; 
  padding: 11px 12px; 
  border-radius: 10px; 
  display: flex; 
  gap: 11px; 
  align-items: center; 
  text-align: left; 
  transition: .2s; 
}
.nav button:hover, .nav button.active { 
  background: #242735; 
  color: #fff; 
}
.nav-icon { 
  width: 20px; 
  text-align: center; 
}
.sidebar-bottom {
  margin-top: auto; 
}
.profile-mini {
  display: flex; 
  align-items: center; 
  gap: 10px; 
  padding: 14px 10px; 
  border-top: 1px solid #2a2d38; 
}
.avatar { 
  width: 38px; 
  height: 38px; 
  border-radius: 50%; 
  display: grid; 
  place-items: center; 
  background: linear-gradient(135deg, #d8d5ff, #8b5cf6); 
  color: #fff; 
  font-weight: 700; 
}
.profile-mini small { 
  color: #9297a5; 
  display: block; 
  margin-top: 2px; 
}
.main { 
  min-width: 0; 
}
.topbar { 
  height: 72px; 
  background: rgba(255, 255, 255, .9); 
  border-bottom: 1px solid var(--border); 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  padding: 0 30px; 
  position: sticky; 
  top: 0; 
  z-index: 10; 
  backdrop-filter: blur(12px); 
}
.search { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  background: var(--surface-2); 
  border-radius: 10px; 
  padding: 10px 14px; 
  width: min(440px, 50vw); 
}
.search input { 
  border: 0; 
  outline: 0; 
  background: transparent; 
  width: 100%; 
}
.top-actions { 
  display: flex; 
  gap: 10px; 
  align-items: center; 
}
.icon-btn { 
  width: 38px; 
  height: 38px; 
  border: 1px solid var(--border); 
  background: #fff; 
  border-radius: 10px; 
  cursor: pointer;
}
.btn { 
  border: 0; 
  border-radius: 10px; 
  padding: 10px 15px; 
  font-weight: 600; 
  transition: .2s; 
}
.btn-primary { 
  background: var(--primary); 
  color: #fff; 
}
.btn-primary:hover { 
  filter: brightness(.95); 
  transform: translateY(-1px); 
}
.btn-secondary { 
  background: var(--surface-2); 
  color: var(--text); 
}
.btn-outline { 
  background: #fff; 
  border: 1px solid var(--border); 
  color: var(--text); 
}
.btn-block {
  width: 100%;
}
.content { 
  padding: 30px; 
  max-width: 1600px; 
  margin: auto; 
  width: 100%; 
}
.page-head { 
  display: flex; 
  align-items: flex-start; 
  justify-content: space-between; 
  gap: 20px; 
  margin-bottom: 24px; 
}
.page-head h1 { 
  font-family: 'Space Grotesk'; 
  margin: 0 0 6px; 
  font-size: 30px; 
}
.page-head p { 
  margin: 0; 
  color: var(--muted); 
}
.actions { 
  display: flex; 
  gap: 10px; 
}
.grid { 
  display: grid; 
  gap: 18px; 
}
.grid-4 { 
  grid-template-columns: repeat(4, 1fr); 
}
.grid-3 { 
  grid-template-columns: repeat(3, 1fr); 
}
.grid-2 { 
  grid-template-columns: repeat(2, 1fr); 
}
.card { 
  background: var(--surface); 
  border: 1px solid var(--border); 
  border-radius: 16px; 
  box-shadow: var(--shadow); 
  padding: 20px; 
}
.stat { 
  display: flex; 
  justify-content: space-between; 
  align-items: flex-start; 
}
.stat .label { 
  color: var(--muted); 
  font-size: 13px; 
}
.stat h2 { 
  margin: 8px 0 5px; 
  font-size: 28px; 
}
.trend { 
  font-size: 12px; 
  font-weight: 600; 
  color: var(--success); 
}
.stat-icon { 
  width: 42px; 
  height: 42px; 
  display: grid; 
  place-items: center; 
  border-radius: 12px; 
  background: #efedff; 
  color: var(--primary); 
}
.job-list { 
  display: flex; 
  flex-direction: column; 
  gap: 12px; 
}
.job { 
  border: 1px solid var(--border); 
  border-radius: 12px; 
  padding: 16px; 
  display: flex; 
  gap: 14px; 
  align-items: flex-start; 
}
.company-logo { 
  width: 42px; 
  height: 42px; 
  border-radius: 12px; 
  background: #eef0ff; 
  display: grid; 
  place-items: center; 
  font-weight: 800; 
  color: #5b50d8; 
  flex-shrink: 0; 
}
.job-main { 
  flex: 1; 
  min-width: 0; 
}
.job-title { 
  font-weight: 700; 
  margin-bottom: 5px; 
}
.job-meta { 
  color: var(--muted); 
  font-size: 13px; 
  display: flex; 
  gap: 12px; 
  flex-wrap: wrap; 
}
.tags { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 6px; 
  margin-top: 10px; 
}
.tag { 
  background: var(--surface-2); 
  padding: 5px 8px; 
  border-radius: 6px; 
  font-size: 11px; 
  color: #4b5563; 
}
.match { 
  margin-left: auto; 
  text-align: right; 
}
.modal-backdrop { 
  position: fixed; 
  inset: 0; 
  background: rgba(17, 19, 27, .55); 
  display: grid; 
  place-items: center; 
  z-index: 50; 
  padding: 20px; 
}
.modal { 
  width: min(620px, 100%); 
  max-height: 90vh; 
  overflow: auto; 
  background: #fff; 
  border-radius: 18px; 
  padding: 24px; 
}
.modal-head { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  margin-bottom: 20px; 
}
.modal h2 { 
  margin: 0; 
  font-family: 'Space Grotesk'; 
}
.form-grid { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 14px; 
}
.field { 
  display: flex; 
  flex-direction: column; 
  gap: 6px; 
}
.field.full { 
  grid-column: 1 / -1; 
}
.field label { 
  font-size: 12px; 
  font-weight: 600; 
}
.field input, .field select, .field textarea { 
  border: 1px solid var(--border); 
  border-radius: 9px; 
  padding: 10px; 
  outline: none; 
}
.field textarea { 
  min-height: 110px; 
  resize: vertical; 
}
.modal-footer { 
  display: flex; 
  justify-content: flex-end; 
  gap: 10px; 
  margin-top: 20px; 
}
.empty { 
  text-align: center; 
  padding: 50px 20px; 
  color: var(--muted); 
}
.toast { 
  position: fixed; 
  right: 22px; 
  bottom: 22px; 
  z-index: 100; 
  background: #171a24; 
  color: #fff; 
  padding: 13px 16px; 
  border-radius: 10px; 
  box-shadow: 0 12px 30px rgba(0, 0, 0, .2); 
  font-size: 13px; 
  animation: toastIn .2s ease; 
}
.toast.error { 
  background: #a83232; 
}
@keyframes toastIn { 
  from { 
    transform: translateY(10px); 
    opacity: 0; 
  } 
  to { 
    transform: translateY(0); 
    opacity: 1; 
  } 
}
@media (max-width: 1100px) { 
  .app { grid-template-columns: 80px 1fr; } 
  .brand-name, .nav button span, .nav-section, .profile-mini div { display: none; } 
  .brand { justify-content: center; padding-bottom: 20px; } 
  .nav button { justify-content: center; } 
  .profile-mini { justify-content: center; } 
  .grid-4 { grid-template-columns: repeat(2, 1fr); } 
}
@media (max-width: 760px) { 
  .app { display: block; } 
  .sidebar { position: fixed; bottom: 0; left: 0; right: 0; height: 66px; z-index: 20; flex-direction: row; padding: 8px; } 
  .brand, .sidebar-bottom, .nav-section { display: none; } 
  .nav { flex-direction: row; width: 100%; justify-content: space-around; } 
  .nav button { padding: 8px; } 
  .nav button.active { background: #242735; } 
  .main { padding-bottom: 66px; } 
  .topbar { padding: 0 14px; } 
  .search { width: 55%; } 
  .content { padding: 20px 14px; } 
  .page-head { flex-direction: column; } 
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } 
  .form-grid { grid-template-columns: 1fr; } 
}
.auth-layout { 
  min-height: 100vh; 
  display: grid; 
  grid-template-columns: 1.05fr .95fr; 
  background: var(--bg); 
}
.auth-visual { 
  padding: 42px clamp(28px, 6vw, 100px); 
  background: linear-gradient(145deg, #11131b 0%, #201d3e 55%, #4f46a5 150%); 
  color: #fff; 
  display: flex; 
  flex-direction: column; 
  justify-content: space-between; 
}
.auth-brand { 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  font-size: 21px; 
}
.auth-hero { 
  max-width: 640px; 
  padding: 50px 0; 
}
.eyebrow { 
  color: #b8b0ff; 
  font-size: 11px; 
  letter-spacing: .15em; 
  font-weight: 800; 
}
.auth-hero h1 { 
  font-family: 'Space Grotesk'; 
  font-size: clamp(42px, 5vw, 72px); 
  line-height: 1.02; 
  margin: 20px 0; 
}
.auth-hero p { 
  color: #c8c9d7; 
  font-size: 18px; 
  line-height: 1.7; 
  max-width: 540px; 
}
.auth-stats { 
  display: flex; 
  gap: 38px; 
  margin-top: 48px; 
  flex-wrap: wrap; 
}
.auth-stats strong { 
  display: block; 
  font-size: 26px; 
}
.auth-stats span { 
  color: #bfc1ce; 
  font-size: 12px; 
}
.auth-panel { 
  display: grid; 
  place-items: center; 
  padding: 30px; 
}
.auth-card { 
  width: min(500px, 100%); 
  background: var(--surface); 
  border: 1px solid var(--border); 
  border-radius: 20px; 
  padding: 32px; 
  box-shadow: var(--shadow); 
}
.auth-tabs { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  background: var(--surface-2); 
  border-radius: 10px; 
  padding: 4px; 
  margin-bottom: 28px; 
}
.auth-tabs button { 
  border: 0; 
  background: transparent; 
  padding: 11px; 
  border-radius: 8px; 
  font-weight: 700; 
  color: var(--muted); 
  cursor: pointer;
}
.auth-tabs button.active { 
  background: var(--surface); 
  color: var(--text); 
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06); 
}
.auth-copy h2 { 
  font-family: 'Space Grotesk'; 
  margin: 0 0 8px; 
  font-size: 30px; 
}
.auth-copy p { 
  color: var(--muted); 
  margin: 0 0 24px; 
}
.auth-card form { 
  display: flex; 
  flex-direction: column; 
  gap: 14px; 
}
.auth-row { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  font-size: 12px; 
  color: var(--muted); 
}
.auth-row a { 
  color: var(--primary); 
  font-weight: 700; 
  cursor: pointer; 
}
.check { 
  display: flex; 
  align-items: flex-start; 
  gap: 8px; 
  font-size: 12px; 
  color: var(--muted); 
  line-height: 1.5; 
}
.demo-note { 
  margin-top: 18px; 
  padding: 12px; 
  border-radius: 10px; 
  background: var(--surface-2); 
  color: var(--muted); 
  font-size: 11px; 
  line-height: 1.5; 
}
.loading { 
  opacity: 0.6; 
  cursor: not-allowed; 
}
.error { 
  color: var(--danger); 
  font-size: 12px; 
}
.muted {
  color: var(--muted);
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const API_BASE = '/api';
const SESSION_KEY = 'jobconnect-session-v4';

const state = { 
  page: 'dashboard', 
  authMode: 'login', 
  user: null, 
  role: 'jobseeker', 
  dark: false, 
  jobs: [], 
  applications: [],
  loading: false
};

const icons = { 
  dashboard: '⌂', 
  jobs: '⌕', 
  applications: '▣', 
  assessments: '◈', 
  messages: '✉', 
  settings: '⚙' 
};

function escapeHTML(value = '') { 
  return String(value).replace(/[&<>'"]/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[c])); 
}

function initials(a = '', b = '') { 
  return `${a[0]||''}${b[0]||''}`.toUpperCase(); 
}

function showToast(message, type = 'success') { 
  const t = document.createElement('div'); 
  t.className = `toast ${type}`; 
  t.textContent = message; 
  document.body.appendChild(t); 
  setTimeout(() => t.remove(), 3500); 
}

async function apiFetch(path, options = {}) {
  try {
    const response = await fetch(`${API_BASE}${path}`, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  } catch (error) {
    showToast(error.message, 'error');
    throw error;
  }
}

async function init() {
  const sessionEmail = localStorage.getItem(SESSION_KEY);
  if (sessionEmail) {
    try {
      const response = await apiFetch('/users');
      const user = response.users.find(u => u.email === sessionEmail);
      if (user) {
        state.user = user;
        state.role = user.role;
        await loadData();
      }
    } catch (error) {
      console.log('Session expired');
    }
  }
  render();
}

async function loadData() {
  if (!state.user) return;
  try {
    const jobsData = await apiFetch('/jobs');
    state.jobs = jobsData.jobs || [];
    const appsData = await apiFetch(`/applications?email=${state.user.email}`);
    state.applications = appsData.applications || [];
  } catch (error) {
    console.log('Failed to load data');
  }
}

function render() { 
  document.getElementById('app').innerHTML = state.user ? appShell() : authShell(); 
}

function authShell() { 
  return `<div class="auth-layout">
    <section class="auth-visual">
      <div class="auth-brand">
        <div class="brand-mark">J</div>
        <strong>JobConnect</strong>
      </div>
      <div class="auth-hero">
        <span class="eyebrow">CAREER OPERATING SYSTEM</span>
        <h1>Connect talent with opportunity.</h1>
        <p>Organizations create real opportunities. Job seekers discover, apply, and grow.</p>
        <div class="auth-stats">
          <div>
            <strong>${state.jobs.length}</strong>
            <span>Real published jobs</span>
          </div>
        </div>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="${state.authMode === 'login' ? 'active' : ''}" onclick="setAuthMode('login')">Log in</button>
          <button class="${state.authMode === 'register' ? 'active' : ''}" onclick="setAuthMode('register')">Create account</button>
        </div>
        ${state.authMode === 'login' ? loginForm() : registerForm()}
      </div>
    </section>
  </div>`; 
}

function loginForm() { 
  return `<div class="auth-copy">
    <h2>Welcome back</h2>
    <p>Sign in to continue to your JobConnect workspace.</p>
  </div>
  <form onsubmit="login(event)">
    <div class="field">
      <label>Email address</label>
      <input id="loginEmail" type="email" required placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" required minlength="6" placeholder="Enter your password" />
    </div>
    <button class="btn btn-primary btn-block" type="submit">Log in to JobConnect</button>
  </form>
  <div class="demo-note">Demo: Use demo@example.com / password123 or create a new account.</div>`; 
}

function registerForm() { 
  return `<div class="auth-copy">
    <h2>Create your account</h2>
    <p>Choose one account role and complete your contact information.</p>
  </div>
  <form onsubmit="register(event)">
    <div class="field">
      <label>I am joining as</label>
      <select id="registerRole" required>
        <option value="jobseeker">Job Seeker</option>
        <option value="organization">Organization / Employer</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>First name</label>
        <input id="firstName" required />
      </div>
      <div class="field">
        <label>Last name</label>
        <input id="lastName" required />
      </div>
    </div>
    <div class="field">
      <label>Email address</label>
      <input id="registerEmail" type="email" required />
    </div>
    <div class="field">
      <label>Phone number</label>
      <input id="phone" type="tel" required />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="registerPassword" type="password" required minlength="6" />
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input id="confirmPassword" type="password" required minlength="6" />
    </div>
    <button class="btn btn-primary btn-block" type="submit">Create my account</button>
  </form>`; 
}

function setAuthMode(mode) { 
  state.authMode = mode; 
  render(); 
}

async function register(event) {
  event.preventDefault();
  const email = document.getElementById('registerEmail').value.trim().toLowerCase();
  const password = document.getElementById('registerPassword').value;
  
  if (password !== document.getElementById('confirmPassword').value) {
    return showToast('Passwords do not match', 'error');
  }

  try {
    state.loading = true;
    await apiFetch('/register', {
      method: 'POST',
      body: JSON.stringify({
        email,
        password,
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        role: document.getElementById('registerRole').value
      })
    });
    state.authMode = 'login';
    showToast('Account created. Please log in.');
    render();
  } finally {
    state.loading = false;
  }
}

async function login(event) {
  event.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;

  try {
    state.loading = true;
    const data = await apiFetch('/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    state.user = data.user;
    state.role = data.user.role;
    localStorage.setItem(SESSION_KEY, data.user.email);
    state.page = 'dashboard';
    await loadData();
    render();
    showToast('Logged in successfully');
  } finally {
    state.loading = false;
  }
}

function logout() { 
  localStorage.removeItem(SESSION_KEY); 
  state.user = null; 
  state.authMode = 'login'; 
  render(); 
}

function navItem(key, label) { 
  return `<button class="${state.page === key ? 'active' : ''}" onclick="navigate('${key}')">
    <span class="nav-icon">${icons[key] || '•'}</span>
    <span>${label}</span>
  </button>`; 
}

function navigate(page) { 
  state.page = page; 
  render(); 
}

function appShell() {
  const userName = escapeHTML(`${state.user.firstName} ${state.user.lastName}`);
  return `<div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">J</div>
        <div class="brand-name">JobConnect</div>
      </div>
      <div class="nav-section">Workspace</div>
      <nav class="nav">
        ${navItem('dashboard', 'Dashboard')}
        ${state.role === 'jobseeker' ? navItem('jobs', 'Find Jobs') + navItem('applications', 'Applications') : ''}
        ${navItem('messages', 'Messages')}
        ${navItem('settings', 'Settings')}
      </nav>
      <div class="sidebar-bottom">
        <button class="profile-mini" onclick="navigate('settings')">
          <div class="avatar">${initials(state.user.firstName, state.user.lastName)}</div>
          <div>
            <strong>${userName}</strong>
            <span>${state.role === 'organization' ? 'Organization' : 'Job Seeker'}</span>
          </div>
        </button>
        <button class="btn btn-outline btn-block" onclick="logout()" style="margin-top: 10px;">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1>${pageTitle()}</h1>
        </div>
        <div class="top-actions">
          <button class="avatar" onclick="navigate('settings')">${initials(state.user.firstName, state.user.lastName)}</button>
        </div>
      </header>
      <section class="content">
        ${pageContent()}
      </section>
    </main>
  </div>`;
}

function pageTitle() {
  const map = {
    dashboard: 'Dashboard',
    jobs: 'Find Jobs',
    applications: 'Your Applications',
    messages: 'Messages',
    settings: 'Settings'
  };
  return map[state.page] || 'JobConnect';
}

function pageContent() {
  const map = {
    dashboard: dashboardPage(),
    jobs: jobsPage(),
    applications: applicationsPage(),
    messages: placeholderPage('Messages', 'Your conversations will appear here.'),
    settings: settingsPage()
  };
  return map[state.page] || map.dashboard;
}

function dashboardPage() {
  const mine = state.applications.filter(a => a.applicantEmail === state.user.email);
  return `
    <div class="card" style="margin-bottom: 24px; background: linear-gradient(135deg, #161826, #2b2556); color: white; padding: 30px;">
      <h2 style="margin: 0 0 10px; font-family: 'Space Grotesk';">Welcome to JobConnect</h2>
      <p style="margin: 0; color: #c8c9d7;">Discover real opportunities and grow your career with organizations you trust.</p>
      <button class="btn btn-primary" onclick="navigate('jobs')" style="margin-top: 12px; background: white; color: #26213f;">Explore Jobs</button>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="stat">
          <div>
            <span class="label">Applications</span>
            <h2>${mine.length}</h2>
          </div>
          <div class="stat-icon">📋</div>
        </div>
      </div>
      <div class="card">
        <div class="stat">
          <div>
            <span class="label">Available Jobs</span>
            <h2>${state.jobs.length}</h2>
          </div>
          <div class="stat-icon">⌕</div>
        </div>
      </div>
    </div>
    ${mine.length > 0 ? `
      <div class="card" style="margin-top: 24px;">
        <h3>Your Applications</h3>
        <div class="job-list">
          ${mine.map(app => `
            <div class="job">
              <div class="company-logo">${escapeHTML(app.company.charAt(0))}</div>
              <div class="job-main">
                <div class="job-title">${escapeHTML(app.title)}</div>
                <div class="job-meta">
                  <span>${escapeHTML(app.company)}</span>
                  <span>${app.current_stage || 'Submitted'}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

function jobsPage() {
  return `
    <div class="card">
      <h3>Available Jobs</h3>
      <div class="job-list">
        ${state.jobs.length > 0 ? state.jobs.map(job => `
          <div class="job">
            <div class="company-logo">${escapeHTML(job.company.charAt(0))}</div>
            <div class="job-main">
              <div class="job-title">${escapeHTML(job.title)}</div>
              <div class="job-meta">
                <span>${escapeHTML(job.company)}</span>
                <span>📍 ${escapeHTML(job.location)}</span>
                <span>💰 ${escapeHTML(job.salary)}</span>
              </div>
            </div>
            <button class="btn btn-primary" onclick="applyForJob('${job.id}')">Apply</button>
          </div>
        `).join('') : `
          <div class="empty">
            <p>No jobs available yet. Check back soon!</p>
          </div>
        `}
      </div>
    </div>
  `;
}

async function applyForJob(jobId) {
  try {
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;
    
    state.loading = true;
    await apiFetch('/applications', {
      method: 'POST',
      body: JSON.stringify({
        jobId: job.id,
        applicantEmail: state.user.email,
        applicantName: `${state.user.firstName} ${state.user.lastName}`
      })
    });
    
    showToast('Application submitted successfully!');
    await loadData();
    render();
  } finally {
    state.loading = false;
  }
}

function applicationsPage() {
  const mine = state.applications.filter(a => a.applicantEmail === state.user.email);
  return `
    <div class="card">
      <h3>Your Applications</h3>
      ${mine.length > 0 ? `
        <div class="job-list">
          ${mine.map(app => `
            <div class="job">
              <div class="company-logo">${escapeHTML(app.company.charAt(0))}</div>
              <div class="job-main">
                <div class="job-title">${escapeHTML(app.title)}</div>
                <div class="job-meta">
                  <span>${escapeHTML(app.company)}</span>
                  <span>Status: ${app.current_stage || 'Submitted'}</span>
                </div>
              </div>
              ${app.psychometric_score !== null ? `<span class="tag">Score: ${app.psychometric_score}%</span>` : ''}
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="empty">
          <p>You haven't applied for any jobs yet.</p>
          <button class="btn btn-primary" onclick="navigate('jobs')">Browse Jobs</button>
        </div>
      `}
    </div>
  `;
}

function settingsPage() {
  return `
    <div class="card">
      <h2 style="margin-top: 0;">Account Settings</h2>
      <div class="form-grid">
        <div>
          <label class="field" style="margin-bottom: 16px;">
            <strong>First Name</strong>
            <input type="text" value="${escapeHTML(state.user.firstName)}" disabled />
          </label>
        </div>
        <div>
          <label class="field" style="margin-bottom: 16px;">
            <strong>Last Name</strong>
            <input type="text" value="${escapeHTML(state.user.lastName)}" disabled />
          </label>
        </div>
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label><strong>Email</strong></label>
        <input type="email" value="${escapeHTML(state.user.email)}" disabled />
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label><strong>Phone</strong></label>
        <input type="tel" value="${escapeHTML(state.user.phone)}" disabled />
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label><strong>Role</strong></label>
        <input type="text" value="${state.user.role === 'organization' ? 'Organization' : 'Job Seeker'}" disabled />
      </div>
    </div>
  `;
}

function placeholderPage(title, text) {
  return `
    <div class="empty" style="padding: 100px 20px;">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(text)}</p>
    </div>
  `;
}

init();
  </script>
</body>
</html>
